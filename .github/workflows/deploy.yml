name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # Build static SPA frontend
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          cd frontend
          npm install

      - name: Build Static Site with Vite
        run: |
          cd frontend
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'frontend/dist'

  # Deploy to GitHub Pages
  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-frontend
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Optional: Automatic Backend Deployment via SSH if host secrets are configured
  deploy-backend-optional:
    runs-on: ubuntu-latest
    needs: deploy-pages
    steps:
      - name: Check SSH Secrets
        id: check-secrets
        env:
          HOST_IP: ${{ secrets.HOST_IP }}
          HOST_SSH_KEY: ${{ secrets.HOST_SSH_KEY }}
        run: |
          if [ -n "$HOST_IP" ] && [ -n "$HOST_SSH_KEY" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
            echo "SSH credentials found. Proceeding with remote deployment."
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "Notice: SSH secrets not configured. Skipping remote backend deployment."
          fi

      - name: Deploy Backend to Host Server via SSH
        if: steps.check-secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST_IP }}
          username: ${{ secrets.HOST_USER || 'ubuntu' }}
          key: ${{ secrets.HOST_SSH_KEY }}
          script: |
            cd ~/SV-mine
            git pull origin main
            cd infra
            docker compose up -d --build
